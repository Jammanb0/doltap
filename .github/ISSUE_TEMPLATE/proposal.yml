name: 제안 / Proposal
description: 새 기능이나 동작 변경을 논의할 때 / Discuss a change before coding
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        코드를 쓰기 전에 어떤 문제를 풀고 싶은지 먼저 나눠 주세요. 영어로 적어도 됩니다.
        Describe the problem before proposing code. English is welcome.
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 겪고 있나요 / What problem are you facing?
      description: 지금 doltap으로는 어렵거나 번거로운 상황을 적어 주세요. / Describe what is difficult with doltap today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 생각한 방법 / Proposed approach
  - type: textarea
    id: alternatives
    attributes:
      label: 지금 쓰는 방법이나 다른 방법 / Alternatives
